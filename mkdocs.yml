site_name: zoompilot wiki
site_description: >-
  The zoompilot owner’s manual. Check your car, install, learn the controls,
  and set up optional features and Jetlink.
site_url: https://zoompilot-wiki.pages.dev
# The wiki's own repository. This is the only place its URL is written:
# the header icon and the "Edit this page" links are built from it, and
# the pages under docs/ send readers to those two links instead of
# carrying the URL. If the repo moves again, change repo_url and
# repo_name here and nothing else.
repo_url: https://github.com/zoompilot/wiki
repo_name: zoompilot/wiki
edit_uri: edit/main/docs/
# the site's sign-off; the experimental-software line sits above the
# footer on every page (overrides/main.html, block footer)
copyright: zoom-zoom-zoom

theme:
  name: material
  # Zensical's new design. Switch to "classic" to get the exact old
  # Material for MkDocs look (same HTML, different stylesheet).
  variant: modern
  custom_dir: overrides
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  # Same faces as zoompilot.ai: Inter for body, JetBrains Mono for code.
  # Audiowide (the site display face) is added in overrides/main.html and
  # used for the wordmark and the home-page hero.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark only, like zoompilot.ai and jetlink. A single mapping (not a
    # list) means the theme renders no scheme toggle and ignores a
    # visitor's saved light choice. "slate" is Material's dark scheme;
    # brand colors are layered on in stylesheets/custom.css.
    scheme: slate
    primary: red
    accent: red
  features:
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.tabs
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search
  # git-revision-date-localized was dropped in the Zensical move:
  # Zensical has no MkDocs plugin runtime yet (native support is
  # planned). The dates were CI-only and are gone for now.

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

extra_css:
  - stylesheets/fonts.css
  - stylesheets/custom.css
  # v2 components (lede, glance, steps, journey, next-step cards) and
  # reading rhythm; documented on community/style-guide.md
  - stylesheets/v2.css
  # zoompilot.ai look: the site's tokens, top bar, rows instead of cards.
  # Loaded after the two above so it wins; print.css stays last.
  - stylesheets/site.css
  - stylesheets/manual.css
  - stylesheets/shared-header.css
  - stylesheets/print.css

extra_javascript:
  # site -> wiki generated data (npm run sync:wiki)
  - assets/steering-torque-data.js
  # wiki-side interactive features; each exits when its mount is absent
  - assets/js/torque-live.js
  - assets/js/settings-data.js
  - assets/js/settings-explorer.js
  - assets/js/vin-decoder.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zoompilot/zoompilot
      name: zoompilot on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/jFWkHC2uhh
      name: zoompilot Discord
    - icon: material/web
      link: https://zoompilot.ai
      name: zoompilot.ai

